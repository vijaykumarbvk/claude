apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: hospital-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
      - name: patient-service
        image: <your-aws-account-id>.dkr.ecr.<region>.amazonaws.com/patient-service:latest
        ports:
        - containerPort: 5003
        env:
        - name: DB_HOST
          value: "mysql-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "hospital_db"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: hospital-ns
spec:
  selector:
    app: patient-service
  ports:
  - port: 5003
    targetPort: 5003
  type: ClusterIP
