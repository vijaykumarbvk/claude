apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: hospital-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
      - name: doctor-service
        image: 286593018001.dkr.ecr.us-east-1.amazonaws.com/venus-doctor-service:3d44c8e049fd340c3881faf3ecb928815dce903c
        ports:
        - containerPort: 5002
        env:
        - name: DB_HOST
          value: "mysql-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "hospital_db"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: hospital-ns
spec:
  selector:
    app: doctor-service
  ports:
  - port: 5002
    targetPort: 5002
  type: ClusterIP
