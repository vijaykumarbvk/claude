# ---------------------------------------------------------------------
# Kafka + Zookeeper, in-cluster.
#
# Why in-cluster rather than Amazon MSK: MSK's smallest cluster costs
# significantly more per month than these two pods and takes ~25 min to
# provision. For a dev/demo build this is the right trade. For
# production, swap this file out and point KAFKA_BOOTSTRAP_SERVERS in
# venus-config at the MSK bootstrap string — no application code changes.
#
# Both StatefulSets need the EBS CSI driver (provisioned in Terraform)
# and the `ebs-storage` StorageClass from efk-stack/storage-cls.yml.
# ---------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: venus
  labels:
    app: zookeeper
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
    - name: peer
      port: 2888
    - name: leader-election
      port: 3888
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: venus
  labels:
    app: zookeeper
spec:
  type: ClusterIP
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: venus
spec:
  serviceName: zookeeper-headless
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      # confluentinc images run as uid 1000 (appuser), but an EBS-backed
      # PVC mounts owned by root by default. Without fsGroup the
      # container can't write to its own data dir and crash-loops with
      # "dub path ... writable FAILED". fsGroup makes the kubelet chown
      # the volume to this group on mount.
      securityContext:
        fsGroup: 1000
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
              name: client
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_DATA_DIR
              value: /var/lib/zookeeper/data
            # cp-zookeeper 7.x disables all four-letter-word admin
            # commands except `srvr` by default. The readinessProbe
            # below uses `ruok`, so without this it always fails,
            # zookeeper never joins the Service's endpoints, and
            # kafka's wait-for-zookeeper init container hangs forever
            # trying to reach a Service with zero endpoints.
            - name: ZOOKEEPER_4LW_COMMANDS_WHITELIST
              value: "ruok,srvr,mntr,conf"
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-storage
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: venus
  labels:
    app: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: venus
  labels:
    app: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: venus
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Same reason as zookeeper's securityContext above — cp-kafka
      # also runs as uid 1000 and needs the EBS volume chowned on mount.
      securityContext:
        fsGroup: 1000
      initContainers:
        # Kafka crash-loops if it starts before Zookeeper is accepting
        # connections, so block until the port answers.
        - name: wait-for-zookeeper
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z zookeeper 2181; do
                echo "waiting for zookeeper..."
                sleep 3
              done
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: broker
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            # Advertise the stable per-pod DNS name from the headless
            # service — this is the address the Flask producers use.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka-headless.venus.svc.cluster.local:9092"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              # A subdirectory of the mount, NOT the mount root. mkfs
              # creates lost+found at the root of every fresh ext4
              # volume, and Kafka's log-dir scanner treats any
              # non-topic-partition directory there as fatal
              # (org.apache.kafka.common.KafkaException: Found
              # directory .../lost+found). Keeping the actual mount at
              # /var/lib/kafka/data and logs one level under it avoids
              # the collision entirely.
              value: /var/lib/kafka/data/logs
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-storage
        resources:
          requests:
            storage: 10Gi
