# ---------------------------------------------------------------------
# These are PLACEHOLDERS. Never commit real values.
#
# Create it imperatively instead (recommended):
#
#   kubectl create secret generic venus-secret -n venus \
#     --from-literal=DB_HOST="$(terraform -chdir=EKS-Terraform output -raw rds_endpoint)" \
#     --from-literal=DB_USER='admin' \
#     --from-literal=DB_PASSWORD='<your-rds-password>' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#
# For production, graduate to AWS Secrets Manager + the External Secrets
# Operator so nothing sensitive lives in git or in plain etcd.
# ---------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: venus-secret
  namespace: venus
type: Opaque
stringData:
  DB_HOST: "venus-hospital-mysql.xxxxxx.us-east-1.rds.amazonaws.com"
  DB_USER: "admin"
  DB_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
